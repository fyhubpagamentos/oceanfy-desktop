<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
    <title>Compartilhar tela — Oceanfy</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: #0a111f;
        color: #e6edf7;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }
      header {
        padding: 16px 20px 10px;
        flex-shrink: 0;
      }
      header h1 { font-size: 16px; font-weight: 600; }
      header p { font-size: 12px; color: #8b9bb4; margin-top: 4px; }
      .tabs {
        display: flex;
        gap: 8px;
        padding: 0 20px 10px;
        flex-shrink: 0;
      }
      .tabs button {
        background: #131c2e;
        border: 1px solid #223047;
        color: #a9b8cf;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
      }
      .tabs button.active {
        background: #1c4ed8;
        border-color: #1c4ed8;
        color: #fff;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 4px 20px 12px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        align-content: start;
      }
      main::-webkit-scrollbar { width: 8px; }
      main::-webkit-scrollbar-thumb { background: #223047; border-radius: 4px; }
      .source {
        background: #101a2c;
        border: 2px solid #1c2941;
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
      }
      .source:hover { border-color: #33507f; }
      .source.selected { border-color: #3b82f6; background: #12203a; }
      .source .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #060b14;
        border-radius: 6px;
        display: block;
        pointer-events: none;
      }
      .source .label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        pointer-events: none;
      }
      .source .label img { width: 16px; height: 16px; flex-shrink: 0; }
      .source .label span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        grid-column: 1 / -1;
        color: #8b9bb4;
        font-size: 13px;
        padding: 24px 0;
        text-align: center;
      }
      footer {
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 12px 20px 16px;
        border-top: 1px solid #16223a;
      }
      footer button {
        font-size: 13px;
        font-weight: 600;
        padding: 8px 22px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      #btn-cancel {
        background: transparent;
        border-color: #2a3b58;
        color: #a9b8cf;
      }
      #btn-cancel:hover { background: #131c2e; }
      #btn-share {
        background: #1c4ed8;
        color: #fff;
      }
      #btn-share:hover:not(:disabled) { background: #2563eb; }
      #btn-share:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1>Compartilhar sua tela</h1>
      <p>Escolha uma tela inteira ou uma janela para compartilhar na chamada.</p>
    </header>
    <div class="tabs">
      <button id="tab-screen" class="active">Telas</button>
      <button id="tab-window">Janelas</button>
    </div>
    <main id="grid"></main>
    <footer>
      <button id="btn-cancel">Cancelar</button>
      <button id="btn-share" disabled>Compartilhar</button>
    </footer>
    <script>
      let allSources = [];
      let currentTab = "screen";
      let selectedId = null;

      const grid = document.getElementById("grid");
      const btnShare = document.getElementById("btn-share");
      const btnCancel = document.getElementById("btn-cancel");
      const tabScreen = document.getElementById("tab-screen");
      const tabWindow = document.getElementById("tab-window");

      function render() {
        const list = allSources.filter((s) => s.type === currentTab);
        grid.innerHTML = "";
        if (list.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = currentTab === "screen" ? "Nenhuma tela encontrada." : "Nenhuma janela encontrada.";
          grid.appendChild(empty);
          return;
        }
        for (const source of list) {
          const card = document.createElement("button");
          card.className = "source" + (source.id === selectedId ? " selected" : "");
          const thumb = document.createElement("img");
          thumb.className = "thumb";
          if (source.thumbnail) thumb.src = source.thumbnail;
          card.appendChild(thumb);
          const label = document.createElement("div");
          label.className = "label";
          if (source.appIcon) {
            const icon = document.createElement("img");
            icon.src = source.appIcon;
            label.appendChild(icon);
          }
          const name = document.createElement("span");
          name.textContent = source.name;
          name.title = source.name;
          label.appendChild(name);
          card.appendChild(label);
          card.addEventListener("click", () => {
            selectedId = source.id;
            btnShare.disabled = false;
            render();
          });
          card.addEventListener("dblclick", () => {
            selectedId = source.id;
            window.oceanfyPicker.select(selectedId);
          });
          grid.appendChild(card);
        }
      }

      function setTab(tab) {
        currentTab = tab;
        tabScreen.classList.toggle("active", tab === "screen");
        tabWindow.classList.toggle("active", tab === "window");
        render();
      }

      tabScreen.addEventListener("click", () => setTab("screen"));
      tabWindow.addEventListener("click", () => setTab("window"));
      btnCancel.addEventListener("click", () => window.oceanfyPicker.cancel());
      btnShare.addEventListener("click", () => {
        if (selectedId) window.oceanfyPicker.select(selectedId);
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.oceanfyPicker.cancel();
      });

      window.oceanfyPicker.onSources((sources) => {
        allSources = sources;
        render();
      });
    </script>
  </body>
</html>
